# Content
headline: "Charming boutique hotel in the heart of Salamanca"
description: |
  Charming small, nicely designed hotel. The hotel's lobby and restaurant 
  makes hanging out in the hotel a pleasure. Hotel Totem is located in the 
  heart of Madrid's Salamanca neighborhood, next to great restaurants and shops.


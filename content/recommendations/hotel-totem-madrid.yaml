# Additional Sections
sections:
  - title: Why I Love It
    content: |
      This hotel perfectly captures Madrid's contemporary spirit while maintaining 
      its classic charm. The attention to detail in every corner makes it feel 
      like staying at a friend's incredibly stylish apartment.
  
  - title: Best For
    content: |
      Design lovers, couples seeking romance, business travelers who appreciate 
      aesthetics, anyone wanting to experience Madrid's sophisticated side.

